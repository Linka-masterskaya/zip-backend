title = "zip-backend gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Exact documented non-production fixture values"
regexes = [
  '''^dev-only-jwt-secret-do-not-use-in-production-2026$''',
  '''^ZGV2LW9ubHktYWVzLWtleS1ub3QtZm9yLXByb2QhISE=$''',
  '''^ZGV2LW9ubHktaG1hYy1rZXktbm90LWZvci1wcm9kISE=$''',
  '''^linka-dev-minio$''',
  '''^linka-dev-minio-secret$''',
  '''^dev-only-smtp-password$''',
  '''^dev-only-grafana-admin$'''
]

[[allowlists]]
description = "Exact historical CI-only fixtures for commit-tree scanning"
regexes = [
  '''^prod_minio_secret_123456789$''',
  '''^prod_jwt_secret_123456789012345678901234567890$''',
  '''^prod_grafana_password_123456789$'''
]
