app:
  env: prod
  port: "8080"
  public_url: "https://linka.rassokha.pro"
  frontend_url: "https://linka.rassokha.pro"
  migrations_dir: "./migrations"
  docs_enabled: false
  trusted_proxies:
    - "127.0.0.1"
    - "10.0.0.0/8"

server:
  metrics_port: "9091"
  read_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "60s"
  metrics_read_timeout: "5s"
  metrics_write_timeout: "5s"
  shutdown_timeout: "30s"

db:
  # Required via DB_URL.
  url: ""
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: "1h"
  healthcheck_period: "30s"

redis:
  # Required via REDIS_URL and must include a password.
  url: ""
  pool_size: 10
  min_idle_conns: 2
  max_idle_conns: 5
  conn_max_idle_time: "5m"
  conn_max_lifetime: "1h"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3
  min_retry_backoff: "8ms"
  max_retry_backoff: "512ms"
  client_name: "zip-backend"

nats:
  connection:
    url: "nats://localhost:4222"
    max_reconnect: 5
    ping_interval: "20s"
    max_pings_outstanding: 3

  stream:
    name: "AI_JOBS"
    init_timeout: "10s"
    max_age: "24h"
    max_bytes: 104857600 # 100MB
    max_msgs: 100000
    duplicates: "5m"

  consumers:
    tts:
      durable: "ai-worker-tts"
      ack_wait: "30s"
      max_deliver: 3
      fetch_max_wait: "5s"
    clamav:
      durable: "ai-worker-clamav"
      ack_wait: "10s"
      max_deliver: 3
      fetch_max_wait: "5s"

minio:
  # Required via MINIO_* environment variables.
  endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: "linka-media"
  use_ssl: true
  timeout: "15s"

jwt:
  # Required via JWT_SECRET.
  secret: ""
  access_ttl: "15m"
  refresh_ttl: "720h"

crypto:
  # Required via CRYPTO_*; never rotate AES without re-encrypting stored email data.
  aes_key: ""
  hmac_key: ""

yandex:
  client_id: ""
  client_secret: ""
  redirect_url: "https://linka.rassokha.pro/api/auth/yandex/callback"

openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  org_id: ""

pictures_bank:
  # Required only while feature_flags.local_bank is false.
  url: ""

feature_flags:
  # File-owned flag: set true to use PostgreSQL + MinIO instead of the external bank.
  local_bank: false

smtp:
  host: "smtp.yandex.ru"
  port: 587
  username: ""
  password: ""
  from_email: ""
  tls: true
  timeout: "10s"
  require_from_match: true
  daily_limit: 300

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  verify_email_token_ttl: 24h
  reset_password_token_ttl: 1h
  email_change_token_ttl: 1h
  bcrypt_cost: 12
  login_rate_limit: 5
  require_email_verification: true
  # Неподтверждённые регистрации не должны держать чужой адрес вечно.
  unverified_retention: 168h
  pack_rate_limit: 60
  forgot_rate_limit: 3
  reset_rate_limit: 3
  verify_resend_rate_limit: 3
  email_confirm_rate_limit: 10
  cookie_secure: true

rate_limit:
  resend:
    scope: "resend"
    limit: 500
    window: 1h

cors:
  allow_origins:
    - "https://linka.rassokha.pro"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Content-Type"
    - "Content-Length"
    - "Accept-Encoding"
    - "X-CSRF-Token"
    - "Authorization"
    - "Accept"
    - "Origin"
    - "Cache-Control"
    - "X-Requested-With"
  expose_headers:
    - "Content-Length"
    - "Content-Type"
    - "Date"
    - "X-Total-Count"
  allow_credentials: true
  max_age: 86400

ttsapi:
  service_url: "https://tts.linka.su"
  mime_type: "audio/mpeg"
  timeout: 30s
  rate_limit: 120
  max_concurrent: 10
  max_text_len: 5000
  max_body_size: 65536

cron:
  voice_refresh:
    interval: 1h
  tts_cleanup:
    interval: 6h
    clean_period: 2160h
    jobs_ttl: 72h
    limit: 100