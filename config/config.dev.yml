app:
  env: dev
  port: "8080"
  public_url: "http://localhost:8080"
  frontend_url: "http://localhost:3000"
  migrations_dir: "./migrations"
  docs_enabled: true
  trusted_proxies:
    - "127.0.0.1"
    - "10.0.0.0/8"

server:
  metrics_port: "9091"
  read_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "60s"
  metrics_read_timeout: "5s"
  metrics_write_timeout: "5s"
  shutdown_timeout: "30s"

db:
  url: "postgres://linka:linka@localhost:5432/linka?sslmode=disable"
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: "1h"
  healthcheck_period: "30s"

redis:
  url: "redis://localhost:6379/0"
  pool_size: 10
  min_idle_conns: 2
  max_idle_conns: 5
  conn_max_idle_time: "5m"
  conn_max_lifetime: "1h"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3
  min_retry_backoff: "8ms"
  max_retry_backoff: "512ms"
  client_name: "zip-backend"

nats:
  connection:
    url: "nats://localhost:4222"
    max_reconnect: 5
    ping_interval: "20s"
    max_pings_outstanding: 3

  stream:
    name: "AI_JOBS"
    init_timeout: "10s"
    max_age: "24h"
    max_bytes: 104857600 # 100MB
    max_msgs: 100000
    duplicates: "5m"

  consumers:
    tts:
      durable: "linka-tts"
      ack_wait: "30s"
      max_deliver: 3
      fetch_max_wait: "5s"
    clamav:
      durable: "linka-clamav"
      ack_wait: "10s"
      max_deliver: 3
      fetch_max_wait: "5s"

minio:
  endpoint: "localhost:9000"
  # DEV ONLY: documented fixture credentials; production validation rejects them.
  access_key: "linka-dev-minio"
  secret_key: "linka-dev-minio-secret"
  bucket: "linka-media"
  use_ssl: false
  timeout: "15s"

jwt:
  # DEV ONLY: production validation rejects this fixture.
  secret: "dev-only-jwt-secret-do-not-use-in-production-2026"
  access_ttl: "15m"
  refresh_ttl: "720h"

crypto:
  # DEV ONLY: base64-encoded 32-byte fixtures; never use for real data.
  aes_key: "ZGV2LW9ubHktYWVzLWtleS1ub3QtZm9yLXByb2QhISE="
  hmac_key: "ZGV2LW9ubHktaG1hYy1rZXktbm90LWZvci1wcm9kISE="

yandex:
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8080/auth/yandex/callback"

openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  org_id: ""

pictures_bank:
  url: "https://pictures.linka.su"
  timeout: "5s"
  requests_per_second: 5
  inbound_per_minute: 120
  max_concurrent: 4
  cache_ttl: "1h"
  max_metadata_bytes: 2097152
  max_image_bytes: 10485760

feature_flags:
  local_bank: false

smtp:
  # Local Mailpit only; no external credentials are tracked.
  host: "mailpit"
  port: 1025
  username: ""
  password: ""
  from_email: "linka-dev@example.test"
  tls: false
  timeout: "10s"
  require_from_match: false
  daily_limit_alert: 300

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  verify_email_token_ttl: 24h
  reset_password_token_ttl: 1h
  email_change_token_ttl: 1h
  bcrypt_cost: 12
  login_rate_limit: 5
  register_rate_limit: 5
  refresh_rate_limit: 10
  # Совпадает с prod: расхождение здесь маскирует 403 на боевом входе.
  # Письмо ловится локально в mailpit (http://localhost:8025).
  require_email_verification: true
  # Неподтверждённые регистрации не должны держать чужой адрес вечно.
  unverified_retention: 168h
  pack_rate_limit: 60
  forgot_rate_limit: 3
  reset_rate_limit: 3
  verify_resend_rate_limit: 3
  email_confirm_rate_limit: 10

profile:
  verify_email_token_ttl: 24h
  email_change_token_ttl: 24h
  email_change_rate_limit: 3
  email_confirm_rate_limit: 10

rate_limit:
  resend:
    scope: "resend"
    limit: 500
    window: 1h

cors:
  allow_origins:
    - "http://localhost:8080"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Content-Type"
    - "Content-Length"
    - "Accept-Encoding"
    - "X-CSRF-Token"
    - "Authorization"
    - "Accept"
    - "Origin"
    - "Cache-Control"
    - "X-Requested-With"
  expose_headers:
    - "Content-Length"
    - "Content-Type"
    - "Date"
    - "X-Total-Count"
  allow_credentials: true
  max_age: 86400
