openapi: 3.0.3
info:
  title: Linka Backend API
  version: 0.3.0
  description: |
    Auth + Profile для Linka Editor. Сверено с дизайном.
    Без username. Вход по email. Refresh — httpOnly cookie (SameSite=Strict). Access — Bearer JWT (HS256, 15m).
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: auth
  - name: profile
  - name: folders
  - name: packs
  - name: media
  - name: pictures
  - name: students

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: refresh_token }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, example: validation_error }
            message: { type: string, example: "Вы ввели некорректный email" }
            details: { type: object, additionalProperties: true }

    TokenResponse:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        token_type:   { type: string, enum: [Bearer], default: Bearer }
        expires_in:   { type: integer, example: 900 }

    RegisterRequest:
      type: object
      required: [name, email, password]
      description: "p18 — имя, email и пароль. Повтор пароля проверяет фронт."
      properties:
        name:     { type: string, minLength: 2, maxLength: 100 }
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [email, password]
      description: "p17 — вход по email"
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties: { token: { type: string } }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string }
        new_password: { type: string, format: password, minLength: 8, maxLength: 72 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      description: "p10 — нужен старый пароль"
      properties:
        current_password: { type: string, format: password }
        new_password:     { type: string, format: password, minLength: 8, maxLength: 72 }

    ChangeEmailRequest:
      type: object
      required: [new_email]
      properties: { new_email: { type: string, format: email } }

    ConfirmEmailRequest:
      type: object
      required: [token]
      properties: { token: { type: string } }

    UpdateProfileRequest:
      type: object
      description: "p3 — единственное редактируемое здесь поле: display_name (только буквы и пробел, p12). Email и пароль — отдельными флоу."
      properties:
        display_name:
          type: string
          maxLength: 100
          pattern: '^[A-Za-zА-Яа-яЁё ]+$'
          description: "только буквы и пробел, без цифр и знаков (p12). В коде валидировать по Unicode-буквам (\\p{L})."

    Profile:
      type: object
      required: [id, email, role, email_verified]
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string, format: email }
        display_name:   { type: string, nullable: true }
        avatar_url:     { type: string, nullable: true, description: presigned MinIO URL }
        role:           { type: string, enum: [defectologist, parent, viewer, admin] }
        email_verified: { type: boolean }
        org_id:         { type: string, format: uuid, nullable: true }
        created_at:     { type: string, format: date-time }

    AvatarResponse:
      type: object
      properties: { avatar_url: { type: string } }

    Folder:
      type: object
      required: [id, org_id, owner_id, section, kind, name, depth, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        org_id:     { type: string, format: uuid }
        owner_id:   { type: string, format: uuid }
        parent_id:  { type: string, format: uuid, nullable: true }
        section:    { type: string, enum: [library, my, students] }
        kind:       { type: string, enum: [folder, student] }
        student_id: { type: string, format: uuid, nullable: true }
        name:       { type: string }
        depth:      { type: integer, minimum: 0, maximum: 4 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pack:
      type: object
      required: [id, org_id, owner_id, folder_id, title, status, goals, notes, config, created_at, updated_at]
      properties:
        id:                { type: string, format: uuid }
        org_id:            { type: string, format: uuid }
        owner_id:          { type: string, format: uuid }
        folder_id:         { type: string, format: uuid }
        library_folder_id: { type: string, format: uuid, nullable: true }
        published_at:      { type: string, format: date-time, nullable: true }
        title:             { type: string }
        status:            { type: string, enum: [draft, published] }
        age_min:           { type: integer, minimum: 3, maximum: 18, nullable: true }
        age_max:           { type: integer, minimum: 3, maximum: 18, nullable: true }
        difficulty:        { type: string, enum: [easy, medium, hard], nullable: true }
        goals:             { type: array, items: { type: string } }
        notes:             { type: string }
        config:            { type: object, additionalProperties: true }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    CreatePackRequest:
      type: object
      required: [title, folder_id]
      properties:
        title: { type: string }
        folder_id: { type: string, format: uuid }

    UpdatePackRequest:
      type: object
      properties:
        title: { type: string }
        folder_id: { type: string, format: uuid }
        age_min: { type: integer, minimum: 3, maximum: 18, nullable: true }
        age_max: { type: integer, minimum: 3, maximum: 18, nullable: true }
        difficulty: { type: string, enum: [easy, medium, hard], nullable: true }
        goals: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }

    MovePackRequest:
      type: object
      required: [folder_id]
      properties:
        folder_id: { type: string, format: uuid }

    PackListItem:
      allOf:
        - { $ref: '#/components/schemas/Pack' }
        - type: object
          required: [folder_id, is_favorite, section]
          properties:
            folder_id: { type: string, format: uuid, description: Папка конкретного размещения набора }
            is_favorite: { type: boolean }
            section: { type: string, enum: [library, my, students] }

    MediaFile:
      type: object
      required: [id, uploader_id, name, sha256, media_type, mime_type, size_bytes, created_at]
      properties:
        id:          { type: string, format: uuid }
        uploader_id: { type: string, format: uuid }
        name:        { type: string, description: "Имя файла, по нему идёт поиск" }
        sha256:      { type: string, pattern: '^[a-f0-9]{64}$' }
        media_type:  { type: string, description: "Первая часть MIME-типа, например image или audio" }
        mime_type:   { type: string }
        size_bytes:  { type: integer, format: int64 }
        created_at:  { type: string, format: date-time }

    Media:
      allOf:
        - $ref: '#/components/schemas/MediaFile'
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri, description: Временная presigned MinIO URL }

    MediaPage:
      type: object
      required: [items]
      description: Страница библиотеки media. Presigned URL не отдаются — их запрашивают поштучно через `/media/{id}`.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MediaFile' }
        next_cursor:
          type: string
          description: Курсор следующей страницы. Отсутствует, если страница последняя.

    PictureCategory:
      type: object
      required: [id, name]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    Picture:
      type: object
      required: [id, name, categories]
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        mimeType:   { type: string }
        categories:
          type: array
          items: { $ref: '#/components/schemas/PictureCategory' }

    PictureReference:
      type: object
      required: [source_picture_id, content_url]
      properties:
        source_picture_id: { type: string, format: uuid }
        content_url: { type: string, description: Защищённый proxy URL; при удалении оригинала возвращает SVG-заглушку }

    PackAdaptation:
      type: object
      required: [id, pack_id, student_id, config, created_by, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        pack_id:    { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        config:     { type: object, additionalProperties: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PackVersion:
      type: object
      required: [id, pack_id, version, config, created_by, created_at]
      properties:
        id:         { type: string, format: uuid }
        pack_id:    { type: string, format: uuid }
        version:    { type: integer, minimum: 1 }
        config:     { type: object, additionalProperties: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    PackVersionSummary:
      type: object
      required: [id, pack_id, version, created_by, created_at]
      properties:
        id:         { type: string, format: uuid }
        pack_id:    { type: string, format: uuid }
        version:    { type: integer, minimum: 1 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    PackVersionRestore:
      type: object
      required: [pack, restored_from_version, backup_version]
      properties:
        pack:                  { $ref: '#/components/schemas/Pack' }
        restored_from_version: { type: integer, minimum: 1 }
        backup_version:        { $ref: '#/components/schemas/PackVersion' }

    Student:
      type: object
      required: [id, email, email_verified, name, status, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string, format: email }
        email_verified: { type: boolean }
        name:           { type: string }
        age:            { type: integer, minimum: 0, maximum: 100, nullable: true }
        status:         { type: string, enum: [active, paused, archived, one_time] }
        last_lesson_at: { type: string, format: date, nullable: true, description: Дата последнего занятия }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    StudentListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Student' }
        total:
          type: integer
          description: Общее количество записей для пагинации
           
    ContentItem:
      type: object
      required: [type, id, name, updated_at]
      properties:
        type:       { type: string, enum: [folder, pack] }
        id:         { type: string, format: uuid }
        name:       { type: string }
        kind:       { type: string, enum: [folder, student], nullable: true }
        student_id: { type: string, format: uuid, nullable: true }
        published:  { type: boolean }
        updated_at: { type: string, format: date-time }

  responses:
    BadRequest:   { description: Невалидный ввод, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Нет/невалидный токен, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:    { description: Запрещено, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict:     { description: Конфликт уникальности, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany:      { description: Rate-limit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация по email (R4, p18) — шлёт письмо
      description: |
        Ответ не зависит от того, занят адрес или свободен: по коду ответа нельзя
        перебирать базу пользователей. Что произошло, адресат узнаёт из письма.

        - адрес свободен — заводим аккаунт и шлём письмо подтверждения;
        - адрес занят, но не подтверждён — забираем его: пароль перезаписывается,
          прежние verify-ссылки перестают работать, уходит новое письмо подтверждения;
        - адрес занят подтверждённым аккаунтом — ничего не меняем, владельцу уходит
          письмо «аккаунт уже существует» со ссылками на вход и восстановление.

        ДОПУЩЕНИЕ (открытый вопрос §8.1): регистрация создаёт новую личную организацию
        и назначает пользователю роль `defectologist`. Модель приглашений/общих org —
        не финализирована, при изменении меняется поведение этого эндпоинта.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '202':
          description: Принято. Письмо отправлено или поставлено в очередь. Тела нет.
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Подтвердить email по токену
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyEmailRequest' } } }
      responses:
        '204': { description: "Подтверждён, токен сожжён" }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Переслать письмо верификации
      description: "Публичный endpoint: email передаётся в теле запроса. Под rate-limit."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Запрос принят }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/login:
    post:
      tags: [auth]
      summary: Вход по email (R5, p17)
      description: "При auth.require_email_verification=true неверифицированный email → 403."
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: OK; refresh в httpOnly cookie
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновить access (ротация + reuse-detection)
      description: "Refresh передаётся только в HttpOnly cookie с SameSite=Lax. Повторное использование старого refresh отзывает всю семью токенов."
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: Новый access; refresh ротируется
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход (p2 «Выйти») — отзыв refresh-семьи
      security: [{ refreshCookie: [] }]
      responses:
        '204': { description: "Refresh-семья удалена, cookie очищен" }

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Запрос сброса (R7, p19) — всегда 202
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } }
      responses:
        '202': { description: Если email есть — письмо (p14) }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Новый пароль по токену (R7, p20)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
      responses:
        '204': { description: "Пароль обновлён, токен сожжён, сессии отозваны" }
        '400': { $ref: '#/components/responses/BadRequest' }

  /profile/me:
    get:
      tags: [profile]
      summary: Мой профиль (p3)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [profile]
      summary: Редактировать display_name (R12, p3/p12)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } }
      responses:
        '200': { description: Обновлён, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/avatar:
    put:
      tags: [profile]
      summary: Загрузить аватар (R14, p4 «Заменить фото»)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Файл слишком большой }
    delete:
      tags: [profile]
      summary: Удалить аватар (p4 «Удалить фото»)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/password:
    post:
      tags: [profile]
      summary: Сменить пароль inline (R15, p10 — нужен старый)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } }
      responses:
        '204': { description: "Изменён, прочие сессии отозваны" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/email:
    post:
      tags: [profile]
      summary: Запрос смены email — подтверждение на СТАРЫЙ email (p13/p16)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeEmailRequest' } } }
      responses:
        '202': { description: Письмо подтверждения на текущий email }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /profile/me/email/confirm:
    post:
      tags: [profile]
      summary: Подтвердить смену email (p16 «Подтвердить»)
      description: "Токен из письма на СТАРЫЙ ящик. После confirm: email=new_email, email_verified=false, верификационное письмо уходит на НОВЫЙ адрес (владение новым ящиком не доказано старым письмом)."
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmEmailRequest' } } }
      responses:
        '204': { description: Email обновлён; verify отправлен на новый адрес }
        '400': { $ref: '#/components/responses/BadRequest' }

  /folders:
    post:
      tags: [folders]
      summary: Создать папку или папку ученика
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, kind, name]
              properties:
                parent_id:  { type: string, format: uuid, nullable: true }
                section:    { type: string, enum: [library, my, students] }
                kind:       { type: string, enum: [folder, student] }
                student_id: { type: string, format: uuid, nullable: true }
                name:       { type: string }
      responses:
        '201': { description: Создана, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [folders]
      summary: Список папок раздела или родителя
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: section, in: query, required: true, schema: { type: string, enum: [library, my, students] } }
        - { name: parent_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Родитель не найден }

  /folders/{id}:
    patch:
      tags: [folders]
      summary: Переименовать папку
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '200': { description: Обновлена, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '404': { description: Не найдена }
    delete:
      tags: [folders]
      summary: Удалить пустую папку
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Удалена }
        '404': { description: Не найдена }
        '409': { $ref: '#/components/responses/Conflict' }

  /folders/{id}/move:
    post:
      tags: [folders]
      summary: Переместить папку; null parent_id означает корень текущего section
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id]
              properties: { parent_id: { type: string, format: uuid, nullable: true } }
      responses:
        '200': { description: Перемещена, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sections/{section}/contents:
    get:
      tags: [folders]
      summary: Содержимое узла дерева — папки и наборы одним списком
      description: >-
        Один эндпоинт на весь экран. Без `parent_id` возвращает корень раздела:
        «Мои наборы», «Библиотека» и «Картотека учеников» — это пункты меню, а не
        папки, поэтому адресовать корень id папки нельзя. В корне лежат только
        папки: у набора `folder_id` объявлен NOT NULL, то есть набор всегда
        находится внутри какой-то папки.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: section, in: path, required: true, schema: { type: string, enum: [library, my, students] } }
        - { name: parent_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Папка внутри раздела. Не задан — корень раздела" }
        - { name: sort, in: query, schema: { type: string, enum: [name, updated_at], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница содержимого
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items:  { type: array, items: { $ref: '#/components/schemas/ContentItem' } }
                  limit:  { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Папка не найдена или недоступна }

  /media:
    get:
      tags: [media]
      summary: Список media организации с поиском, фильтром и курсорной пагинацией
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: false, schema: { type: string }, description: "Поиск по имени, регистронезависимый" }
        - { name: type, in: query, required: false, schema: { type: string }, description: "Фильтр по media_type, например image или audio" }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Курсор из next_cursor предыдущей страницы" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200': { description: Страница media, content: { application/json: { schema: { $ref: '#/components/schemas/MediaPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [media]
      summary: Загрузить изображение или аудио в приватное объектное хранилище
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Максимум 20 MiB }
      responses:
        '201': { description: Загружено или найдено по SHA-256, content: { application/json: { schema: { $ref: '#/components/schemas/Media' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: Файл или квота превышены }

  /media/{id}:
    get:
      tags: [media]
      summary: Получить метаданные и временную ссылку на media
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Media доступно, content: { application/json: { schema: { $ref: '#/components/schemas/Media' } } } }
        '404': { description: Media не найдено или недоступно }
    delete:
      tags: [media]
      summary: Удалить своё media, если оно больше не используется
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Метаданные, объект MinIO и занятая квота удалены' }
        '404': { description: Media не найдено или принадлежит другому пользователю }
        '409': { description: Media ещё используется набором или адаптацией }

  /pictures/categories:
    get:
      tags: [pictures]
      summary: Получить категории LINKa Pictures Bank через защищённый proxy
      description: Ответ кэшируется; исходящие запросы глобально ограничены через Redis.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PictureCategory' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { description: Pictures Bank недоступен или исчерпан исходящий бюджет }

  /pictures/search:
    get:
      tags: [pictures]
      summary: Найти изображения в LINKa Pictures Bank
      description: Одинаковые одновременные запросы объединяются, результаты кэшируются.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Picture' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { description: Pictures Bank недоступен или исчерпан исходящий бюджет }

  /pictures/{id}/content:
    get:
      tags: [pictures]
      summary: Получить изображение Pictures Bank через ограниченный proxy
      description: Байты кэшируются в памяти процесса на `pictures_bank.cache_ttl`; ответ содержит согласованный `Cache-Control max-age`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Изображение с браузерным Cache-Control; для удалённого оригинала — SVG и `X-Picture-Placeholder: deleted`, при временной недоступности — `unavailable`"
          content:
            image/png:  { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif:  { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { description: 'Pictures Bank недоступен, ответ слишком большой или имеет неверный MIME' }

  /pictures/{id}/import:
    post:
      tags: [pictures]
      summary: Получить ссылку на изображение Pictures Bank без локального копирования
      description: Совместимый endpoint возвращает `source_picture_id` для config. Байты не скачиваются в MinIO и не расходуют квоту организации.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Reference создан без локального сохранения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PictureReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }

  /packs:
    post:
      tags: [packs]
      summary: Создать набор
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePackRequest' }
      responses:
        '201': { description: Набор создан, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [packs]
      summary: Найти наборы во всех доступных папках
      description: >-
        Возвращает размещения наборов во всех доступных папках: личных, ученических
        и библиотеке организации. Набор, размещённый в нескольких папках, возвращается
        отдельной записью для каждой папки с соответствующими folder_id и section.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string }, description: Подстрока title без учёта регистра }
        - { name: age, in: query, schema: { type: integer, minimum: 3, maximum: 18 }, description: age_min <= age <= age_max }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: section, in: query, schema: { type: string, enum: [library, my, students] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Размещения наборов, подходящие под поиск и фильтры
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /packs/{id}:
    get:
      tags: [packs]
      summary: Получить набор
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Набор, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Набор не найден }
    patch:
      tags: [packs]
      summary: Обновить набор
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePackRequest' }
      responses:
        '200': { description: Набор обновлён, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Набор не найден }
    delete:
      tags: [packs]
      summary: Удалить набор
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Набор удалён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Набор не найден }

  /packs/{id}/move:
    post:
      tags: [packs]
      summary: Переместить набор в другую папку
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovePackRequest' }
      responses:
        '200': { description: Набор перемещён, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Набор не найден }

  /packs/{id}/config:
    put:
      tags: [packs]
      summary: Полностью сохранить валидный Linka 2.0 config и его media usages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Config сохранён атомарно, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Набор не найден }

  /packs/{id}/export:
    get:
      tags: [packs]
      summary: Скачать `.linka` ZIP (`config.json` и каталог `media/`)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Потоковый архив до 50 MiB
          headers:
            Content-Disposition:
              description: Имя файла с расширением `.linka`
              schema: { type: string, example: 'attachment; filename="pack.linka"' }
            Content-Length:
              description: Размер готового ZIP в байтах
              schema: { type: integer, format: int64 }
          content:
            application/vnd.linka+zip:
              schema: { type: string, format: binary }
        '400': { description: Сохранённый config не проходит валидацию Linka 2.0 }
        '404': { description: Набор не найден }
        '409': { description: В config есть ссылка на отсутствующий media-файл }
        '413': { description: Архив превышает 50 MiB }

  /packs/{id}/adaptations:
    get:
      tags: [packs]
      summary: Получить адаптации набора для учеников
      description: Возвращает доступные текущему пользователю снимки config, созданные для учеников этого набора
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Адаптации набора, начиная с недавно обновлённых
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackAdaptation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Набор не найден или недоступен пользователю }

  /adaptations/{id}:
    get:
      tags: [packs]
      summary: Получить адаптацию набора
      description: Возвращает сохранённый для ученика снимок config
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Адаптация набора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackAdaptation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Адаптация не найдена или недоступна пользователю }

  /adaptations/{id}/config:
    put:
      tags: [packs]
      summary: Полностью сохранить config адаптации
      description: Валидирует Linka 2.0 и атомарно обновляет config адаптации и связанные media usages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Config адаптации сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackAdaptation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Config ссылается на недоступный media-файл }
        '404': { description: Адаптация не найдена или недоступна пользователю }
        '413': { description: Размер config превышает допустимый лимит }

  /adaptations/{id}/export:
    get:
      tags: [packs]
      summary: Скачать адаптацию как `.linka` ZIP (`config.json` и каталог `media/`)
      description: Экспортируется сохранённый снимок адаптации, а не текущий config исходного набора.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Потоковый архив адаптации до 50 MiB
          headers:
            Content-Disposition:
              description: Имя файла с расширением `.linka`
              schema: { type: string, example: 'attachment; filename="pack-adaptation.linka"' }
            Content-Length:
              description: Размер готового ZIP в байтах
              schema: { type: integer, format: int64 }
          content:
            application/vnd.linka+zip:
              schema: { type: string, format: binary }
        '400': { description: Сохранённый config адаптации не проходит валидацию Linka 2.0 }
        '404': { description: Адаптация не найдена или недоступна пользователю }
        '409': { description: В config адаптации есть ссылка на отсутствующий media-файл }
        '413': { description: Архив превышает 50 MiB }

  /packs/{id}/students:
    post:
      tags: [packs]
      summary: Назначить текущий снимок набора одному или нескольким ученикам
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_ids]
              properties:
                student_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Идемпотентно созданные или обновлённые адаптации
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PackAdaptation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Один из учеников недоступен }
        '404': { description: Набор не найден }

  /packs/{id}/students/{student_id}:
    delete:
      tags: [packs]
      summary: Снять назначение набора с ученика
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: student_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Назначение снято }
        '404': { description: Назначение не найдено }

  /packs/{id}/versions:
    post:
      tags: [packs]
      summary: Создать неизменяемый снимок текущей конфигурации набора
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Версия создана; используемые ею media защищены от удаления
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackVersion' }
        '404': { description: Набор не найден }
    get:
      tags: [packs]
      summary: Получить историю версий набора, начиная с новых
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: История версий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackVersionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Набор не найден }

  /packs/{id}/versions/{version}:
    get:
      tags: [packs]
      summary: Получить полный снимок конкретной версии
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Полный снимок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Набор или версия не найдены }

  /packs/{id}/versions/{version}/restore:
    post:
      tags: [packs]
      summary: Атомарно восстановить конфигурацию из версии
      description: Перед восстановлением текущая конфигурация автоматически сохраняется новой версией.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Версия восстановлена, предыдущая текущая конфигурация сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackVersionRestore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Набор или версия не найдены }

  /packs/import:
    post:
      tags: [packs]
      summary: Импортировать безопасный `.linka` ZIP в папку
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, folder_id, title]
              properties:
                file:      { type: string, format: binary, description: Максимум 50 MiB }
                folder_id: { type: string, format: uuid }
                title:     { type: string }
      responses:
        '201': { description: Набор импортирован, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: 'Архив, распакованные данные или квота превышены' }

  /packs/{id}/publication:
    post:
      tags: [packs]
      summary: Опубликовать набор ссылкой в папку библиотеки
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_folder_id]
              properties: { library_folder_id: { type: string, format: uuid } }
      responses:
        '200': { description: Опубликован, content: { application/json: { schema: { $ref: '#/components/schemas/Pack' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [packs]
      summary: Снять публикацию, не удаляя исходный набор
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Публикация снята или уже отсутствовала }
        '404': { description: Набор не найден }

  /students:
    post:
      tags: [students]
      summary: Создать ученика
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:  { type: string, format: email }
                name:   { type: string }
                age:    { type: integer, minimum: 0, maximum: 100, nullable: true }
                status: { type: string, enum: [active, paused, archived, one_time], default: active }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [students]
      summary: Ученики текущего дефектолога (с пагинацией и сортировкой)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: "Количество записей на странице" }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: "Смещение для пагинации" }
        - { name: sort_by, in: query, schema: { type: string, enum: [name, age, status, last_lesson_at], default: name }, description: "Поле для сортировки" }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc }, description: "Направление сортировки" }
      responses:
        '200':
          description: Пагинированный список учеников
          content:
            application/json:
              schema: { items: { $ref: '#/components/schemas/StudentListResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /students/{id}:
    patch:
      tags: [students]
      summary: Обновить ученика
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:  { type: string, format: email }
                name:   { type: string }
                age:    { type: integer, minimum: 0, maximum: 100 }
                status: { type: string, enum: [active, paused, archived, one_time] }
      responses:
        '200': { description: Обновлён, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Ученик не найден }
    delete:
      tags: [students]
      summary: Архивировать ученика; запрещено при наличии student folder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Soft-delete выполнен }
        '404': { description: Ученик не найден }
        '409': { $ref: '#/components/responses/Conflict' }
