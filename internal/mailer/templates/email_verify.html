<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email</title>
    <style>
        @media only screen and (max-width: 520px) {
            .email-container { width: 100% !important; padding: 20px 10px !important; }
            .content-padding { padding: 24px 20px !important; }
            .header-padding { padding: 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
    <table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 40px 20px;" class="email-container">
        <tr>
            <td align="center">
                <table width="100%" max-width="480" border="0" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 16px; max-width: 480px; width: 100%; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 24px 32px; border-bottom: 1px solid #f0f0f0;" class="header-padding">
                            <img src="cid:logo" alt="Linka" width="48" height="48" style="display: block; border: 0;">
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 32px;" class="content-padding">
                            <p style="margin: 0 0 16px 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: #1a1a1a;">
                                Здравствуйте{{if .Name}}, {{.Name}}{{end}}!
                            </p>
                            
                            <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #333333;">
                                Вы указали <strong style="color: #1a1a1a;">{{.Email}}</strong> в своем профиле Linka.su.<br>
                                Пожалуйста, подтвердите адрес электронной почты.
                            </p>

                            <!-- Button -->
                            <table border="0" cellspacing="0" cellpadding="0" width="100%">
                                <tr>
                                    <td align="center" bgcolor="#4A90E2" style="border-radius: 8px;">
                                        <a href="{{.FrontendURL}}/verify-email?token={{.Token}}" target="_blank" style="display: inline-block; padding: 16px 24px; font-family: sans-serif; font-size: 16px; color: #ffffff; text-decoration: none; font-weight: 500; width: 100%; box-sizing: border-box; text-align: center;">
                                            Подтвердить
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
