services:
  zip-backend:
    build: .
    ports:
      - "8080:8080"
    networks:
      - linka-net
    env_file:
      - .env    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"    
    networks:
      - linka-net
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - zip-backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=warn
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - linka-net
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=linka
      - POSTGRES_PASSWORD=linka
      - POSTGRES_DB=linka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - linka-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - linka-net
    environment:
      # Приём писем без учётных данных: config.dev.yml ходит в SMTP без логина,
      # а с MP_SMTP_AUTH отправка падала на 535 и терялась в логе — регистрация
      # отвечала 202, но письмо не приходило.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH: "${UI_USERNAME:-admin}:${UI_PASSWORD:-webpass}"
      MP_MAX_MESSAGES: 1000
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8025/livez" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  grafana_data:
  postgres_data:
  mailpit-data:
    
networks:
  linka-net:
