services:
  zip-backend:
    build: .
    ports:
      - "8080:8080"
    networks:
      - linka-net
    env_file:
      - .env    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"    
    networks:
      - linka-net
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - zip-backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=warn
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - linka-net
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    container_name: postgresql
    image: postgres:15-alpine
    restart: unless-stopped    
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=linka
      - POSTGRES_PASSWORD=linka
      - POSTGRES_DB=linka
    networks:
      - linka-net
    healthcheck:      
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    container_name: minio
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000" # порт API
      - "9001:9001" # порт веб-консоли
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-linka-dev-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-linka-dev-minio-secret}
    networks:
      - linka-net
    healthcheck:      
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5    
    command: [ "server", "/data", "--console-address", ":9001" ]

  nats:
    container_name: nats
    image: nats:alpine
    restart: unless-stopped
    ports:
      - "4222:4222" # порт приложения
      - "8222:8222" # порт мониторинга
    volumes:
      - nats-data:/data
    networks:
      - linka-net
    healthcheck:      
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5    
    command: [ "-js", "-m", "8222", "--sd", "/data" ]

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./deploy/loki/loki-config.yml:/etc/loki/config.yml
    networks:
      - linka-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    command: -config.file=/etc/loki/config.yml

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    volumes:
      - ./deploy/alloy/alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - linka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - linka-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - linka-net
    environment:      
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH: "${UI_USERNAME:-admin}:${UI_PASSWORD:-webpass}"
      MP_MAX_MESSAGES: 1000
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8025/livez" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  minio-data:
  nats-data:
  loki-data:
  alloy-data:
  redis-data:
  mailpit-data:
  grafana_data:  

networks:
  linka-net:    