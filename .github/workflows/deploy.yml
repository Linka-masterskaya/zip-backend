name: Build and Push Docker images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta_server.outputs.version }}
      server_digest: ${{ steps.build_server.outputs.digest }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Docker meta Server
        id: meta_server
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/linka-masterskaya/zip-backend/server
          tags: |
            type=sha,format=short,priority=250
            type=raw,value=latest

      - name: Build and push Server
        id: build_server
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.sha }}

      - name: Publish immutable rotation image reference
        env:
          SERVER_DIGEST: ${{ steps.build_server.outputs.digest }}
        run: |
          printf '### Immutable server image\n\n`ghcr.io/linka-masterskaya/zip-backend/server@%s`\n' \
            "$SERVER_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Audit active secret fingerprints
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRYPTO_AES_KEY: ${{ secrets.CRYPTO_AES_KEY }}
          CRYPTO_HMAC_KEY: ${{ secrets.CRYPTO_HMAC_KEY }}
        run: >-
          bash scripts/audit-secret-fingerprints.sh
          JWT_SECRET CRYPTO_AES_KEY CRYPTO_HMAC_KEY

      - name: Render deployment environment
        env:
          CI_APP_ENV: prod
          CI_APP_PORT: "8080"
          CI_CONFIG_PATH: config/config.prod.yml
          CI_APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          CI_APP_FRONTEND_URL: ${{ vars.APP_FRONTEND_URL }}
          CI_CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
          CI_VERSION: ${{ needs.build-and-push.outputs.version }}
          CI_DB_URL: ${{ secrets.DB_URL }}
          CI_DB_MIGRATE_URL: ${{ secrets.DB_MIGRATE_URL }}
          CI_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          CI_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CI_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CI_REDIS_URL: ${{ secrets.REDIS_URL }}
          CI_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CI_JWT_ACCESS_TTL: "15m"
          CI_JWT_REFRESH_TTL: "720h"
          CI_CRYPTO_AES_KEY: ${{ secrets.CRYPTO_AES_KEY }}
          CI_CRYPTO_HMAC_KEY: ${{ secrets.CRYPTO_HMAC_KEY }}
          CI_MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          CI_MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          CI_MINIO_ENDPOINT: ${{ vars.CADDY_DOMAIN_NAME }}
          CI_MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          CI_MINIO_USE_SSL: "true"
          CI_MINIO_TIMEOUT: "15s"
          CI_NATS_CONNECTION_URL: "nats://nats:4222"
          CI_CADDY_DOMAIN_NAME: ${{ vars.CADDY_DOMAIN_NAME }}
          CI_CADDY_LETSENCRYPT_EMAIL: ${{ vars.CADDY_LETSENCRYPT_EMAIL }}
          CI_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          CI_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          CI_YANDEX_REDIRECT_URL: ${{ vars.YANDEX_REDIRECT_URL }}
          CI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CI_OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          CI_PICTURES_BANK_URL: ${{ vars.PICTURES_BANK_URL }}
          CI_SMTP_HOST: ${{ vars.SMTP_HOST }}
          CI_SMTP_PORT: ${{ vars.SMTP_PORT }}
          CI_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          CI_SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          CI_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CI_SMTP_TLS: ${{ vars.SMTP_TLS }}
          CI_SMTP_TIMEOUT: "10s"
          CI_SMTP_REQUIRE_FROM_MATCH: ${{ vars.SMTP_REQUIRE_FROM_MATCH }}
          CI_SMTP_DAILY_LIMIT_ALERT: "300"
          CI_AUTH_RESET_PASSWORD_TOKEN_TTL: "1h"
          CI_AUTH_BCRYPT_COST: "12"
          CI_AUTH_REFRESH_RATE_LIMIT: "10"
          CI_GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CI_GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL }}
          CI_TTSAPI_SERVICE_URL: ${{ vars.TTSAPI_SERVICE_URL }}
        run: |
          bash scripts/render-deploy-env.sh .env.example .env CI_
          bash scripts/validate-deploy-env.sh .env

      - name: Prepare server directories
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: mkdir -p ~/zip-backend ~/frontend/dist

      - name: Copy files to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.server.yaml,deploy/,scripts/,.env"
          target: "~/zip-backend"

      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_HOST: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          DEPLOY_VERSION: ${{ needs.build-and-push.outputs.version }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: GITHUB_TOKEN,REGISTRY_HOST,REGISTRY_USERNAME,DEPLOY_VERSION
          script: |
            cd ~/zip-backend
            printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin
            bash scripts/server-deploy.sh $DEPLOY_VERSION

      - name: Verify deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: curl -sf http://localhost:9091/readyz || exit 1
